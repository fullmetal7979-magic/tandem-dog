# Product identity (COSMOS). This file cannot import TypeScript, so these
# literals mirror src/shared/fork-identity.ts; packaging.test.mjs fails when
# the two drift apart. Side-by-side with upstream Mixdog needs a distinct appId
# (Windows AUMID, macOS bundle id), protocol scheme and userData name.
appId: app.cosmos.desktop
productName: 코스모스
artifactName: cosmos-desktop-${os}-${arch}.${ext}
asar: true
asarUnpack:
  # The singleton service may be owned by the plain Node CLI. Keep its one-file
  # adapter and remote UI assets readable without Electron's ASAR fs patch.
  - out/main/daemon.cjs
  - out/renderer/**
  # daemon.cjs resolves this lazy native dependency relative to its unpacked
  # location, so keep the package's JS, workers, and native bindings together.
  - node_modules/@homebridge/node-pty-prebuilt-multiarch/**
  # Keep the Win32 FFI loader and its platform-native binding on disk.
  - node_modules/koffi/**
  - node_modules/@koromix/koffi-*/**
# Native modules ship as prebuilt binaries mirrored into runtime.asar.unpacked
# by prepare-runtime.mjs; never rebuild them against Electron headers here.
npmRebuild: false
nodeGypRebuild: false
extraMetadata:
  name: cosmos-desktop
protocols:
  name: 코스모스
  schemes:
    - cosmos
directories:
  buildResources: build
files:
  - out/**
  - package.json
  - '!out/main/capture-window.js'
  - '!**/*.map'
extraResources:
  # BrowserWindow uses the same explicit icon as the executable/shortcut so
  # Windows taskbar rendering never depends on Explorer's embedded-icon cache.
  - from: build/mixdog.ico
    to: mixdog.ico
  # Linux tray icon: Electron reads ICO only on Windows.
  - from: build/mixdog.png
    to: mixdog.png
  # Electron resolves modules directly from this archive. NSIS therefore
  # installs one runtime file instead of expanding thousands of dependencies.
  - from: .runtime/runtime.asar
    to: runtime.asar
  # electron-builder filters a source path containing node_modules. The
  # preparation step mirrors native binaries and external-process scripts under
  # this neutral root; restore Electron's exact ASAR-unpacked layout at the destination.
  - from: .runtime/native-modules
    to: runtime.asar.unpacked/node_modules
  # The desktop daemon imports node-pty from app.asar.unpacked. Stage the
  # complete package under a neutral path so electron-builder cannot filter it.
  - from: .runtime/desktop-node-pty
    to: app.asar.unpacked/node_modules/@homebridge/node-pty-prebuilt-multiarch
  # Product-native executables stay canonical GitHub release assets. Desktop
  # preparation downloads, verifies, and embeds only this platform's set,
  # plus the macOS/Linux Computer Use backend it builds from source.
  - from: .runtime/native-tools
    to: native-tools
  # License obligations travel with the installed app: MIT requires its
  # permission notice alongside the derived files, Apache-2.0 the license
  # text plus the upstream NOTICE.
  - from: ../../LICENSE
    to: LICENSE.txt
  - from: ../../NOTICE.md
    to: NOTICE.md
  - from: ../../LICENSES
    to: LICENSES
  - from: THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt
win:
  icon: build/mixdog.ico
  verifyUpdateCodeSignature: false
  target:
    - nsis
nsis:
  installerIcon: build/mixdog.ico
  installerHeaderIcon: build/mixdog.ico
  # One-click, per-user installation avoids elevation and machine-wide state.
  oneClick: true
  perMachine: false
  # Keep a desktop entry for direct discoverability after a silent one-click install.
  createDesktopShortcut: always
mac:
  # Generated by scripts/generate-brand-icons.mjs with the macOS grid inset.
  icon: build/icon.icns
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  # Developer ID builds run under the hardened runtime. The entitlements keep
  # V8's JIT, bundled native modules, composer dictation, and the osascript
  # helpers (folder picker, clipboard attachments) working; helpers inherit them.
  # Signing and notarization only happen when CI provides the credentials.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: COSMOS(코스모스)는 음성 받아쓰기에 마이크를 사용합니다.
    NSAppleEventsUsageDescription: COSMOS(코스모스)는 폴더 선택 창과 클립보드 첨부를 위해 AppleScript를 사용합니다.
linux:
  category: Development
  target:
    - AppImage
# No owner/repo on purpose: this fork must never publish to, or auto-update
# from, upstream Mixdog. CI passes -c.publish.owner / -c.publish.repo (see
# .github/workflows/desktop-package.yml); a local build falls back to the
# checkout's git origin remote. verify-update-metadata.mjs checks the result.
publish:
  provider: github
  channel: latest
