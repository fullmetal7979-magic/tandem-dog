<title>Tandem Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 왼쪽 레일 + 상단 '탠덤 바'(데스크 A ⟷ B 두 채널) + 뷰 전환 메인. 폰에서는 레일이 하단 탭바가 됨 */
:root{
  --paper:#F2F4F8; --panel:#FFFFFF; --sunk:#E9EDF4; --ink:#121829; --ink-2:#4B5470; --ink-3:#7C849E; --line:#DBE0EA;
  --a:#3344DD; --a-soft:#E5E8FC; --a-ink:#FFFFFF;
  --b:#DB5A26; --b-soft:#FBE8DE; --b-ink:#FFFFFF;
  --ok:#1C8F5A; --ok-soft:#DFF3E9; --warn:#B07800; --warn-soft:#FBF0D4; --bad:#CC2E47; --bad-soft:#FADFE4;
  --shadow:0 1px 2px rgba(18,24,41,.06),0 8px 24px -12px rgba(18,24,41,.18);
  --scrim:rgba(10,14,26,.62);
  --font-display:"Bricolage Grotesque","IBM Plex Sans KR",system-ui,sans-serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px; --r-lg:16px;
  --dA:var(--a); --dB:var(--b); --dC:#0F8A74; --dD:#C02C7A; --dE:#9C7300; --dF:#0A7DAD; --dG:#7340CC; --dH:#8A5A2B;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D111C; --panel:#151A28; --sunk:#10141F; --ink:#E8EBF4; --ink-2:#A3ABC4; --ink-3:#8C95B0; --line:#252C40;
  --a:#8291FF; --a-soft:#1D2347; --a-ink:#0D111C;
  --b:#FF8E5E; --b-soft:#3A2217; --b-ink:#0D111C;
  --ok:#41C98B; --ok-soft:#12301F; --warn:#E8B444; --warn-soft:#33280F; --bad:#FF6179; --bad-soft:#3A1720;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.6);
  --scrim:rgba(3,5,10,.72); color-scheme:dark;
  --dC:#3FD1B4; --dD:#FF6FB5; --dE:#E9BE4A; --dF:#4CC3F2; --dG:#B08CFF; --dH:#D9A06B;
}}
:root[data-theme="dark"]{
  --paper:#0D111C; --panel:#151A28; --sunk:#10141F; --ink:#E8EBF4; --ink-2:#A3ABC4; --ink-3:#8C95B0; --line:#252C40;
  --a:#8291FF; --a-soft:#1D2347; --a-ink:#0D111C;
  --b:#FF8E5E; --b-soft:#3A2217; --b-ink:#0D111C;
  --ok:#41C98B; --ok-soft:#12301F; --warn:#E8B444; --warn-soft:#33280F; --bad:#FF6179; --bad-soft:#3A1720;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.6);
  --scrim:rgba(3,5,10,.72); color-scheme:dark;
  --dC:#3FD1B4; --dD:#FF6FB5; --dE:#E9BE4A; --dF:#4CC3F2; --dG:#B08CFF; --dH:#D9A06B;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
code,kbd,.mono{font-family:var(--font-mono);font-size:.88em}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em;word-break:keep-all}
.vlead,.hero-title,.dk-title,.tip-b{word-break:keep-all;overflow-wrap:anywhere}
p{margin:0}
:focus-visible{outline:2px solid var(--a);outline-offset:2px;border-radius:6px}
::selection{background:var(--a-soft)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:18px;padding:22px 14px;border-right:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:34px;height:34px;flex:none}
.brand-name{font-family:var(--font-display);font-weight:800;font-size:21px;letter-spacing:-.03em;line-height:1}
.brand-sub{font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-btn{display:flex;align-items:center;gap:11px;padding:9px 10px;border:0;background:none;border-radius:9px;cursor:pointer;color:var(--ink-2);text-align:left;font-weight:500;position:relative}
.nav-btn svg{width:18px;height:18px;flex:none}
.nav-btn:hover{background:var(--sunk);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--ink);color:var(--paper)}
.nav-badge{margin-left:auto;min-width:20px;height:20px;border-radius:10px;padding:0 6px;font-size:11px;font-weight:700;display:grid;place-items:center;background:var(--bad);color:var(--paper)}
.nav-badge[hidden]{display:none!important}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.kbd-hint{font-size:12px;color:var(--ink-3);padding:0 8px}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:var(--panel);font-size:11px}

.main{min-width:0;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding-inline:28px}

/* ---------- tandem bar ---------- */
.tbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tbar-in{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;padding-block:12px}
.desk{display:flex;align-items:center;gap:12px;min-width:0;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.desk.is-me{box-shadow:inset 0 0 0 1.5px var(--dc)}
.desk-tag{width:34px;height:34px;border-radius:9px;background:var(--dc);color:var(--paper);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:18px;flex:none}
.desk-meta{min-width:0;flex:1}
.desk-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.desk-name .you{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--dc);background:var(--ds);border-radius:5px;padding:1px 5px}
.desk-sub{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.link{width:92px;height:22px;position:relative}
.link svg{width:100%;height:100%;overflow:visible}
.link .wire{stroke:var(--line);stroke-width:2;fill:none;stroke-dasharray:4 5}
.link.live .wire{stroke:var(--ink-3);animation:flow 1.2s linear infinite}
.link .pk{fill:var(--ink)}
@keyframes flow{to{stroke-dashoffset:-18}}
.tbar-actions{display:flex;gap:6px}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{color:var(--ink);border-color:var(--ink-3)}
.icon-btn svg{width:18px;height:18px}

.conn{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}

/* ---------- views ---------- */
.view{padding-block:26px 64px;display:flex;flex-direction:column;gap:22px}
.view[hidden]{display:none!important}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.vtitle{font-family:var(--font-display);font-weight:800;font-size:clamp(26px,3.4vw,36px);letter-spacing:-.03em;line-height:1.08;margin-top:4px}
.vlead{color:var(--ink-2);max-width:62ch;margin-top:8px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;min-width:0;display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-t{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.card-t .q{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);font-size:11px;display:grid;place-items:center;color:var(--ink-3);cursor:help;background:none;padding:0}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:8px}
.sep{height:1px;background:var(--line);border:0;margin:2px 0}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.a{background:var(--a);border-color:var(--a);color:var(--a-ink)}
.btn.b{background:var(--b);border-color:var(--b);color:var(--b-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.in{width:100%;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--sunk);padding:0 12px;min-width:0}
textarea.in{height:auto;min-height:84px;padding:10px 12px;resize:vertical;line-height:1.5}
.in:focus{outline:none;border-color:var(--a);background:var(--panel);box-shadow:0 0 0 3px var(--a-soft)}
.in.mono{font-family:var(--font-mono);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--sunk);gap:2px}
.seg button{border:0;background:none;padding:4px 11px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--sunk);color:var(--ink-2)}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li-main{flex:1;min-width:0}
.li-t{font-weight:600;overflow-wrap:anywhere}
.li-s{font-size:12.5px;color:var(--ink-3)}
.stripe{width:4px;align-self:stretch;border-radius:2px;flex:none;background:var(--line)}
.stripe.bad{background:var(--bad)!important}
.path{font-family:var(--font-mono);font-size:13px;overflow-wrap:anywhere}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:18px;color:var(--ink-3);font-size:13px;text-align:center}
.empty b{color:var(--ink-2)}

/* code block */
.code{position:relative;background:var(--sunk);border:1px solid var(--line);border-radius:10px;min-width:0}
.code pre{margin:0;padding:12px 14px;overflow-x:auto;font-family:var(--font-mono);font-size:12.5px;line-height:1.6;white-space:pre}
.code .copy{position:absolute;top:6px;right:6px}
.code-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:var(--ink-2);padding:8px 12px 0}

/* coach */
.coach{display:flex;flex-direction:column;gap:8px}
.tip{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:11px;background:var(--sunk);border:1px solid var(--line)}
.tip-i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none;font-size:12px;font-weight:800}
.tip.bad .tip-i{background:var(--bad);color:var(--paper)}
.tip.warn .tip-i{background:var(--warn);color:#1A1405}
.tip.ok .tip-i{background:var(--ok);color:var(--paper)}
.tip.info .tip-i{background:var(--ink);color:var(--paper)}
.tip-b{flex:1;min-width:0;font-size:13.5px}
.tip-b b{font-weight:700}
.tip .btn{margin-top:6px}

/* desk duo on overview */
.duo{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.dcard{border-radius:var(--r-lg);border:1px solid var(--line);background:var(--panel);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.dcard-top{background:var(--ds);padding:16px 18px;display:flex;gap:14px;align-items:center}
.dcard-letter{font-family:var(--font-display);font-weight:800;font-size:46px;line-height:.9;color:var(--dc);letter-spacing:-.04em}
.dcard-body{padding:14px 18px 18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;font-size:13.5px}
.dcard-body dt{color:var(--ink-3);font-size:12.5px}
.dcard-body dd{margin:0;min-width:0;overflow-wrap:anywhere}
.load{display:inline-flex;gap:3px;vertical-align:middle}
.load i{width:6px;height:14px;border-radius:2px;background:var(--line)}
.load[data-l="1"] i:nth-child(-n+1),.load[data-l="2"] i:nth-child(-n+2),.load[data-l="3"] i:nth-child(-n+3){background:var(--dc)}

/* kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px;min-width:0}
.col.drop{outline:2px dashed var(--ink-3);outline-offset:-4px}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 4px;font-weight:700;font-size:13px}
.col-h .n{font-family:var(--font-mono);color:var(--ink-3);font-weight:400}
.task{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 11px;display:flex;flex-direction:column;gap:7px;cursor:grab;position:relative}
.task-t{font-weight:600;font-size:13.5px;overflow-wrap:anywhere}
.task-paths{display:flex;flex-wrap:wrap;gap:4px}
.task-paths code{background:var(--sunk);border-radius:5px;padding:1px 6px;font-size:11.5px;overflow-wrap:anywhere}
.task-acts{display:flex;gap:4px;flex-wrap:wrap}

/* relay & baton */
.bubble{border-radius:12px;padding:10px 12px;background:var(--sunk);border:1px solid var(--line);min-width:0}
.bubble pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--font-mono);font-size:12.5px}
.baton{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.baton.new{border-color:var(--dc,var(--a));box-shadow:0 0 0 3px var(--ds,var(--a-soft))}

/* gauge */
.gauge{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.gauge svg{width:150px;height:150px;flex:none}
.g-track{stroke:var(--sunk);fill:none}
.g-val{fill:none;stroke-linecap:round;transition:stroke-dashoffset .6s}
.g-num{font-family:var(--font-display);font-weight:800;fill:var(--ink)}
.g-lab{fill:var(--ink-3);font-size:10px}
.bar{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;display:flex}
.bar i{display:block;height:100%}

/* toast */
.toasts{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--paper);padding:11px 14px;border-radius:12px;box-shadow:var(--shadow);font-size:13.5px;display:flex;gap:10px;align-items:flex-start;animation:tin .25s ease-out}
.toast .pill{flex:none}
@keyframes tin{from{transform:translateY(8px);opacity:.3}}

/* modal */
.modal{position:fixed;inset:0;z-index:90;background:var(--scrim);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none!important}
.sheet{background:var(--panel);border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-family:var(--font-display);font-weight:800;font-size:24px;letter-spacing:-.02em}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pick button.new{border-style:dashed}
.pick button{border:1.5px solid var(--line);background:var(--panel);border-radius:14px;padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.pick button[aria-pressed="true"]{border-color:var(--dc);background:var(--ds)}
.pick .L{font-family:var(--font-display);font-weight:800;font-size:34px;color:var(--dc);line-height:1}

/* tour */
.tour-hole{position:fixed;z-index:100;border-radius:14px;box-shadow:0 0 0 9999px var(--scrim);pointer-events:none;transition:all .35s cubic-bezier(.2,.8,.2,1)}
.tour-card{position:fixed;z-index:101;width:min(360px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:10px;transition:top .35s,left .35s}
.tour-step{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3)}
.tour-card h3{font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-.02em}
.tour-dots{display:flex;gap:4px}
.tour-dots i{width:16px;height:4px;border-radius:2px;background:var(--line)}
.tour-dots i.on{background:var(--ink)}

/* palette */
.pal{position:fixed;inset:0;z-index:95;background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.pal[hidden]{display:none!important}
.pal-box{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.pal-in{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:16px;background:none;outline:none}
.pal-list{max-height:52vh;overflow:auto;padding:6px}
.pal-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px 12px;border-radius:9px;text-align:left;cursor:pointer}
.pal-item[aria-selected="true"]{background:var(--sunk)}
.pal-item .k{margin-left:auto;font-size:11.5px;color:var(--ink-3)}

/* hint bar: 반응형 도움말 */
.hintbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;padding:9px 14px;font-size:13px;display:flex;gap:9px;align-items:center;max-width:min(640px,calc(100vw - 32px))}
.hintbar[hidden]{display:none!important}
.hintbar b{color:var(--a)}

/* help */
details.faq{border-top:1px solid var(--line);padding:12px 0}
details.faq:first-of-type{border-top:0}
details.faq summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.faq summary::after{content:"+";color:var(--ink-3);font-family:var(--font-mono)}
details.faq[open] summary::after{content:"–"}
details.faq p{margin-top:8px;color:var(--ink-2);font-size:13.5px}
.chat{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow:auto;padding:2px}
